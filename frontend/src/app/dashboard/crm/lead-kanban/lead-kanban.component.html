<div class="h-full flex flex-col overflow-hidden">
    <div class="flex justify-between items-center mb-6 px-1">
        <h2 class="text-2xl font-bold text-gray-800 dark:text-white">Deal Pipeline</h2>
        <button class="bg-purple-600 hover:bg-purple-700 text-white px-4 py-2 rounded-lg transition-colors">
            New Deal
        </button>
    </div>

    <!-- Kanban Board -->
    <div class="flex-1 overflow-x-auto overflow-y-hidden pb-4">
        <div class="flex h-full space-x-4 min-w-max" cdkDropListGroup>

            <div *ngFor="let stage of stages"
                class="w-80 flex flex-col bg-gray-100 dark:bg-gray-800 rounded-lg h-full max-h-full">
                <!-- Column Header -->
                <div
                    class="p-4 border-b border-gray-200 dark:border-gray-700 font-semibold text-gray-700 dark:text-gray-200 flex justify-between">
                    <span>{{ stage }}</span>
                    <span class="bg-gray-200 dark:bg-gray-700 px-2 py-0.5 rounded text-xs">
                        {{ board()[stage].length }}
                    </span>
                </div>

                <!-- Column Items -->
                <div cdkDropList [id]="stage" [cdkDropListData]="board()[stage]" (cdkDropListDropped)="drop($event)"
                    class="flex-1 overflow-y-auto p-4 space-y-3 custom-scrollbar">
                    <div *ngFor="let lead of board()[stage]" cdkDrag
                        class="bg-white dark:bg-gray-700 p-4 rounded-lg shadow-sm border border-gray-200 dark:border-gray-600 cursor-move hover:shadow-md transition-shadow">
                        <div class="text-sm font-medium text-gray-900 dark:text-gray-100 mb-1">{{ lead.title }}</div>
                        <div class="text-xs text-gray-500 dark:text-gray-400 mb-2">{{ lead.client_name }}</div>
                        <div class="flex justify-between items-center">
                            <span class="text-xs font-semibold text-green-600 dark:text-green-400">
                                ${{ lead.value }}
                            </span>
                            <div
                                class="w-6 h-6 rounded-full bg-purple-100 dark:bg-purple-900 text-purple-600 dark:text-purple-300 flex items-center justify-center text-xs">
                                {{ lead.assigned_to_name ? lead.assigned_to_name[0] : '?' }}
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>
