<div class="space-y-6 animate-fade-in p-2">
    <!-- Header -->
    <div class="flex items-center justify-between">
        <div>
            <h1 class="text-2xl font-bold font-heading text-gray-800 dark:text-white">Onboarding Checklist</h1>
            <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">Manage tasks for new hires.</p>
        </div>
        <button (click)="openModal()" class="btn-primary">
            <i class="fas fa-plus"></i> Assign New Task
        </button>
    </div>

    <!-- Tasks Table -->
    <div class="card p-0 overflow-hidden">
        <table class="w-full text-left text-sm border-collapse">
            <thead
                class="bg-gray-50 dark:bg-gray-800 border-b border-gray-100 dark:border-gray-700 text-xs uppercase text-gray-500 dark:text-gray-400 font-semibold tracking-wider">
                <tr>
                    <th class="p-4">Task</th>
                    <th class="p-4">Assigned To</th>
                    <th class="p-4">Due Date</th>
                    <th class="p-4">Status</th>
                    <th class="p-4 text-right">Actions</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-100 dark:divide-gray-800">
                <tr *ngFor="let task of tasks()" class="hover:bg-gray-50 dark:hover:bg-white/5 transition-colors">
                    <td class="p-4">
                        <div class="font-medium text-gray-900 dark:text-white">{{ task.title }}</div>
                        <div class="text-xs text-gray-400 mt-1">{{ task.description }}</div>
                    </td>
                    <td class="p-4 text-gray-600 dark:text-gray-300">{{ task.employee_name }}</td>
                    <td class="p-4 text-gray-600 dark:text-gray-300">{{ task.due_date | date }}</td>
                    <td class="p-4">
                        <span class="px-2 py-1 text-xs font-medium rounded-full border" [ngClass]="{
                                'bg-yellow-50 text-yellow-700 border-yellow-200 dark:bg-yellow-900/20 dark:text-yellow-400': task.status === 'PENDING',
                                'bg-blue-50 text-blue-700 border-blue-200 dark:bg-blue-900/20 dark:text-blue-400': task.status === 'IN_PROGRESS',
                                'bg-green-50 text-green-700 border-green-200 dark:bg-green-900/20 dark:text-green-400': task.status === 'COMPLETED'
                            }">
                            {{ task.status.replace('_', ' ') }}
                        </span>
                    </td>
                    <td class="p-4 text-right space-x-2">
                        <button *ngIf="task.status !== 'COMPLETED'" (click)="updateStatus(task, 'COMPLETED')"
                            class="text-green-600 hover:text-green-700 text-xs font-medium transition-colors">
                            <i class="fas fa-check"></i> Mark Complete
                        </button>
                        <button *ngIf="task.status === 'PENDING'" (click)="updateStatus(task, 'IN_PROGRESS')"
                            class="text-blue-600 hover:text-blue-700 text-xs font-medium transition-colors">
                            <i class="fas fa-play"></i> Start
                        </button>
                    </td>
                </tr>
                <tr *ngIf="tasks().length === 0">
                    <td colspan="5" class="p-8 text-center text-gray-500 dark:text-gray-400">
                        <i class="fas fa-clipboard-list text-4xl text-gray-300 dark:text-gray-600 mb-3 block"></i>
                        No onboarding tasks found.
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Assign Task Modal -->
<div *ngIf="showModal()"
    class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm animate-fade-in">
    <div
        class="bg-white dark:bg-dark-card rounded-2xl shadow-xl w-full max-w-md border border-gray-100 dark:border-gray-700">
        <div class="p-6 border-b border-gray-100 dark:border-gray-700 flex items-center justify-between">
            <h3 class="text-xl font-bold font-heading text-gray-800 dark:text-white">Assign Onboarding Task</h3>
            <button (click)="closeModal()"
                class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 transition-colors">
                <i class="fas fa-times text-xl"></i>
            </button>
        </div>

        <form [formGroup]="taskForm" (ngSubmit)="onSubmit()" class="p-6">
            <div class="space-y-4">
                <div class="space-y-1">
                    <label class="text-sm font-medium text-gray-700 dark:text-gray-300">Task Title</label>
                    <input type="text" formControlName="title" class="input" placeholder="e.g. Email Setup">
                </div>

                <div class="space-y-1">
                    <label class="text-sm font-medium text-gray-700 dark:text-gray-300">Description</label>
                    <textarea formControlName="description" rows="3" class="input resize-none"></textarea>
                </div>

                <div class="space-y-1">
                    <label class="text-sm font-medium text-gray-700 dark:text-gray-300">Employee (ID)</label>
                    <input type="number" formControlName="employee" class="input">
                </div>

                <div class="space-y-1">
                    <label class="text-sm font-medium text-gray-700 dark:text-gray-300">Due Date</label>
                    <input type="date" formControlName="due_date" class="input">
                </div>
            </div>

            <div class="mt-6 flex justify-end gap-3 pt-6 border-t border-gray-100 dark:border-gray-700">
                <button type="button" (click)="closeModal()" class="btn-secondary">Cancel</button>
                <button type="submit" [disabled]="taskForm.invalid" class="btn-primary">
                    <i class="fas fa-check"></i> Assign
                </button>
            </div>
        </form>
    </div>
</div>
