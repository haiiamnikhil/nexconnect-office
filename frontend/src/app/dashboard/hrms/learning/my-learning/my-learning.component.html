<div class="p-6">
    <h2 class="text-2xl font-bold text-gray-800 mb-6">My Learning</h2>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <div *ngFor="let enrollment of enrolledCourses"
            class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
            <div class="h-32 bg-gray-200 relative">
                <img *ngIf="enrollment.course.thumbnail" [src]="enrollment.course.thumbnail"
                    class="w-full h-full object-cover" alt="Course thumbnail">
                <div *ngIf="!enrollment.course.thumbnail"
                    class="w-full h-full flex items-center justify-center text-gray-400 bg-gray-100">
                    <i class="fas fa-graduation-cap text-3xl"></i>
                </div>
            </div>
            <div class="p-4">
                <h3 class="text-lg font-semibold text-gray-800 mb-2">{{enrollment.course.title}}</h3>

                <div class="mb-4">
                    <div class="flex justify-between text-xs text-gray-500 mb-1">
                        <span>Progress</span>
                        <span>{{enrollment.progress_percentage}}%</span>
                    </div>
                    <div class="w-full bg-gray-200 rounded-full h-2">
                        <div class="bg-green-500 h-2 rounded-full" [style.width.%]="enrollment.progress_percentage">
                        </div>
                    </div>
                </div>

                <button [routerLink]="['/dashboard/learning/courses', enrollment.course.id]"
                    class="w-full bg-indigo-600 text-white py-2 rounded-lg hover:bg-indigo-700 transition-colors">
                    {{ enrollment.progress_percentage > 0 ? 'Continue Learning' : 'Start Course' }}
                </button>
            </div>
        </div>

        <!-- Empty State -->
        <div *ngIf="!loading && enrolledCourses.length === 0"
            class="col-span-full text-center py-12 bg-gray-50 rounded-lg border border-dashed border-gray-300">
            <i class="fas fa-book text-4xl text-gray-400 mb-4"></i>
            <h3 class="text-lg font-medium text-gray-900">You haven't enrolled in any courses yet</h3>
            <p class="text-gray-500 mb-6">Explore the catalog to find new learning opportunities.</p>
            <a routerLink="/dashboard/learning/catalog"
                class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md shadow-sm text-white bg-blue-600 hover:bg-blue-700">
                Browse Catalog
            </a>
        </div>
    </div>
</div>
