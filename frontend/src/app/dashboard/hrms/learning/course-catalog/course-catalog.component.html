<div class="p-6">
    <div class="flex justify-between items-center mb-6">
        <h2 class="text-2xl font-bold text-gray-800">Course Catalog</h2>
        <div class="flex gap-2">
            <input type="text" placeholder="Search courses..."
                class="px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            <div class="w-48">
                <app-dropdown [options]="categoryOptions()" [ngModel]="selectedCategory()"
                    (ngModelChange)="selectedCategory.set($event)" placeholder="Category">
                </app-dropdown>
            </div>
        </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <div *ngFor="let course of courses()"
            class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden cursor-pointer hover:shadow-md transition-shadow">
            <div class="h-40 bg-gray-200 relative">
                <img *ngIf="course.thumbnail" [src]="course.thumbnail" class="w-full h-full object-cover"
                    alt="Course thumbnail">
                <div *ngIf="!course.thumbnail"
                    class="w-full h-full flex items-center justify-center text-gray-400 bg-gray-100">
                    <i class="fas fa-book-open text-4xl"></i>
                </div>
                <span
                    class="absolute top-2 right-2 bg-blue-100 text-blue-800 text-xs font-semibold px-2.5 py-0.5 rounded">
                    {{course.category}}
                </span>
            </div>
            <div class="p-4">
                <h3 class="text-lg font-semibold text-gray-800 mb-2">{{course.title}}</h3>
                <p class="text-sm text-gray-500 mb-4 line-clamp-2">{{course.description || 'No description available'}}
                </p>

                <div class="flex justify-between items-center text-xs text-gray-500">
                    <span class="flex items-center gap-1">
                        <i class="far fa-clock"></i> {{course.duration}} mins
                    </span>
                    <span class="flex items-center gap-1">
                        <i class="far fa-user"></i> {{course.instructor}}
                    </span>
                </div>

                <button class="w-full mt-4 bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition-colors">
                    Enroll Now
                </button>
            </div>
        </div>
    </div>
</div>
