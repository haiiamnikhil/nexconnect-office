<div *ngIf="course" class="flex h-[calc(100vh-64px)] overflow-hidden">
    <!-- Sidebar -->
    <div class="w-80 bg-white border-r border-gray-200 overflow-y-auto flex flex-col">
        <div class="p-4 border-b border-gray-200 sticky top-0 bg-white z-10">
            <h3 class="font-bold text-gray-800 text-lg">{{course.title}}</h3>
            <div class="mt-2 w-full bg-gray-100 rounded-full h-2">
                <div class="bg-green-500 h-2 rounded-full" style="width: 30%"></div>
            </div>
            <p class="text-xs text-gray-500 mt-1">30% Completed</p>
        </div>

        <div class="flex-1">
            <div *ngFor="let module of course.modules" class="border-b border-gray-100">
                <div class="p-4 bg-gray-50 font-medium text-gray-700 text-sm">
                    {{module.title}}
                </div>
                <div>
                    <button *ngFor="let lesson of module.lessons" (click)="selectLesson(lesson)"
                        class="w-full text-left p-3 pl-6 hover:bg-blue-50 flex items-center gap-3 text-sm transition-colors"
                        [class.bg-blue-50]="activeLesson?.id === lesson.id"
                        [class.text-blue-700]="activeLesson?.id === lesson.id">
                        <i class="fas fa-check-circle" [class.text-green-500]="lesson.completed"
                            [class.text-gray-300]="!lesson.completed"></i>
                        <span class="flex-1">{{lesson.title}}</span>
                        <span class="text-xs text-gray-400">{{lesson.duration}}m</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="flex-1 overflow-y-auto bg-gray-50 p-8">
        <div *ngIf="activeLesson" class="max-w-4xl mx-auto">
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-8 min-h-[500px]">
                <h1 class="text-2xl font-bold text-gray-800 mb-6">{{activeLesson.title}}</h1>

                <div *ngIf="activeLesson.type === 'VIDEO'"
                    class="aspect-w-16 aspect-h-9 bg-black rounded-lg mb-6 flex items-center justify-center text-white">
                    <!-- Placeholder for video player -->
                    <i class="fas fa-play-circle text-6xl"></i>
                </div>

                <div *ngIf="activeLesson.type === 'ARTICLE'" class="prose max-w-none">
                    <p>Lesson content goes here...</p>
                </div>

                <div class="mt-8 flex justify-end">
                    <button (click)="markComplete()" [disabled]="activeLesson.completed"
                        class="px-6 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 disabled:opacity-50 disabled:cursor-not-allowed">
                        {{ activeLesson.completed ? 'Completed' : 'Mark as Complete' }}
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
