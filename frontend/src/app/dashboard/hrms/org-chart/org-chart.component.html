<div class="p-6">
    <div class="flex justify-between items-center mb-6">
        <div>
            <h2 class="text-2xl font-bold text-gray-900 dark:text-white">Organization Chart</h2>
            <p class="text-gray-500 dark:text-gray-400">View hierarchical structure</p>
        </div>
        <p-button label="Back to Dashboard" icon="pi pi-arrow-left" (click)="goBack()"
            styleClass="p-button-outlined"></p-button>
    </div>

    <div class="card overflow-x-auto bg-white dark:bg-gray-800 rounded-xl shadow-sm p-4">
        <p-organizationChart [value]="data()" selectionMode="single" styleClass="company-org-chart">
            <ng-template let-node pTemplate="person">
                <div
                    class="p-2 text-center min-w-[150px] border rounded-lg bg-surface-0 dark:bg-surface-900 border-surface-200 dark:border-surface-700 shadow-sm hover:shadow-md transition-all cursor-pointer">
                    <div class="font-bold text-gray-800 dark:text-gray-100 mb-1">{{ node.data.name }}</div>
                    <div class="text-sm text-gray-500 dark:text-gray-400">{{ node.data.title }}</div>
                </div>
            </ng-template>
        </p-organizationChart>

        <div *ngIf="data().length === 0" class="text-center p-8 text-gray-500">
            <i class="pi pi-sitemap text-4xl mb-3"></i>
            <p>No hierarchy data found.</p>
        </div>
    </div>
</div>
