<div class="space-y-6 animate-fade-in p-2">
    <!-- Header -->
    <div class="flex items-center justify-between">
        <div>
            <h1 class="text-2xl font-bold font-heading text-gray-800 dark:text-white">Asset Management</h1>
            <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">Track and manage company assets allocation.</p>
        </div>
        <button *ngIf="authService.hasPermission('asset:CREATE')" class="btn-primary inline-flex items-center gap-2">
            <i class="fas fa-laptop w-5 h-5" aria-hidden="true"></i>
            <span>Allocate Asset</span>
        </button>
    </div>

    <!-- Asset Stats -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
        <div class="card border-t-4 border-t-primary-500">
            <div class="flex items-center justify-between">
                <div>
                    <p class="text-sm font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider">Total
                        Assets</p>
                    <h3 class="text-2xl font-bold text-gray-900 dark:text-white mt-1">124</h3>
                </div>
                <div class="p-3 bg-blue-50 dark:bg-blue-900/20 text-blue-600 dark:text-blue-400 rounded-lg">
                    <i class="fas fa-archive text-xl w-6 h-6" aria-hidden="true"></i>
                </div>
            </div>
        </div>

        <div class="card border-t-4 border-t-green-500">
            <div class="flex items-center justify-between">
                <div>
                    <p class="text-sm font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider">Allocated
                    </p>
                    <h3 class="text-2xl font-bold text-gray-900 dark:text-white mt-1">98</h3>
                </div>
                <div class="p-3 bg-green-50 dark:bg-green-900/20 text-green-600 dark:text-green-400 rounded-lg">
                    <i class="fas fa-check-circle text-xl w-6 h-6" aria-hidden="true"></i>
                </div>
            </div>
        </div>

        <div class="card border-t-4 border-t-yellow-500">
            <div class="flex items-center justify-between">
                <div>
                    <p class="text-sm font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider">Available
                    </p>
                    <h3 class="text-2xl font-bold text-gray-900 dark:text-white mt-1">26</h3>
                </div>
                <div class="p-3 bg-yellow-50 dark:bg-yellow-900/20 text-yellow-600 dark:text-yellow-400 rounded-lg">
                    <i class="fas fa-boxes text-xl w-6 h-6" aria-hidden="true"></i>
                </div>
            </div>
        </div>

        <div class="card border-t-4 border-t-red-500">
            <div class="flex items-center justify-between">
                <div>
                    <p class="text-sm font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider">Maintenance
                    </p>
                    <h3 class="text-2xl font-bold text-gray-900 dark:text-white mt-1">12</h3>
                </div>
                <div class="p-3 bg-red-50 dark:bg-red-900/20 text-red-600 dark:text-red-400 rounded-lg">
                    <i class="fas fa-tools text-xl"></i>
                </div>
            </div>
        </div>
    </div>

    <!-- Recent Allocations -->
    <div class="card p-0 overflow-hidden">
        <div class="px-6 py-4 border-b border-gray-100 dark:border-gray-700 bg-gray-50 dark:bg-white/5">
            <h3 class="font-semibold font-heading text-gray-900 dark:text-white">Recent Allocations</h3>
        </div>
        <div class="overflow-x-auto">
            <table class="w-full text-sm text-left border-collapse">
                <thead
                    class="bg-gray-50 dark:bg-gray-800 border-b border-gray-100 dark:border-gray-700 text-xs uppercase text-gray-500 dark:text-gray-400 font-semibold tracking-wider">
                    <tr>
                        <th class="p-4">Asset</th>
                        <th class="p-4">Type</th>
                        <th class="p-4">Allocated To</th>
                        <th class="p-4">Date</th>
                        <th class="p-4">Status</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-100 dark:divide-gray-800">
                    <tr class="hover:bg-gray-50 dark:hover:bg-white/5 transition-colors">
                        <td class="p-4">
                            <div class="font-medium text-gray-900 dark:text-white">MacBook Pro 16"</div>
                            <div class="text-xs text-gray-400">SN: MBP2024-001</div>
                        </td>
                        <td class="p-4 text-gray-600 dark:text-gray-300">Laptop</td>
                        <td class="p-4 text-gray-600 dark:text-gray-300">John Doe</td>
                        <td class="p-4 text-gray-500 dark:text-gray-400">2024-01-15</td>
                        <td class="p-4">
                            <span
                                class="px-2 py-1 text-xs font-medium rounded-full border bg-green-50 text-green-700 border-green-200 dark:bg-green-900/20 dark:text-green-400">
                                Allocated
                            </span>
                        </td>
                    </tr>
                    <tr>
                        <td colspan="5" class="p-8 text-center text-gray-500 dark:text-gray-400">
                            <i class="fas fa-database text-4xl text-gray-300 dark:text-gray-600 mb-3 block"></i>
                            View full asset inventory for more details.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
