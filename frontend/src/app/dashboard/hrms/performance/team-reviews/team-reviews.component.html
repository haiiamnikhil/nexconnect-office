<div class="space-y-6 animate-fade-in p-2">
    <!-- Header -->
    <div class="flex items-center justify-between">
        <div>
            <h1 class="text-2xl font-bold font-heading text-gray-800 dark:text-white">Team Reviews</h1>
            <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">Manage performance reviews for your team members.
            </p>
        </div>
        <button class="btn-primary">
            <i class="fas fa-star"></i> Start New Review
        </button>
    </div>

    <!-- Review Stats -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <div class="card border-t-4 border-t-blue-500">
            <div class="flex items-center justify-between">
                <div>
                    <p class="text-sm font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider">Pending</p>
                    <h3 class="text-2xl font-bold text-gray-900 dark:text-white mt-1">5</h3>
                </div>
                <div class="p-3 bg-blue-50 dark:bg-blue-900/20 text-blue-600 dark:text-blue-400 rounded-lg">
                    <i class="fas fa-clock text-xl"></i>
                </div>
            </div>
        </div>

        <div class="card border-t-4 border-t-yellow-500">
            <div class="flex items-center justify-between">
                <div>
                    <p class="text-sm font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider">In Progress
                    </p>
                    <h3 class="text-2xl font-bold text-gray-900 dark:text-white mt-1">3</h3>
                </div>
                <div class="p-3 bg-yellow-50 dark:bg-yellow-900/20 text-yellow-600 dark:text-yellow-400 rounded-lg">
                    <i class="fas fa-edit text-xl"></i>
                </div>
            </div>
        </div>

        <div class="card border-t-4 border-t-green-500">
            <div class="flex items-center justify-between">
                <div>
                    <p class="text-sm font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider">Completed
                    </p>
                    <h3 class="text-2xl font-bold text-gray-900 dark:text-white mt-1">12</h3>
                </div>
                <div class="p-3 bg-green-50 dark:bg-green-900/20 text-green-600 dark:text-green-400 rounded-lg">
                    <i class="fas fa-check-circle text-xl"></i>
                </div>
            </div>
        </div>
    </div>

    <!-- Reviews List -->
    <div class="card p-0 overflow-hidden">
        <div class="px-6 py-4 border-b border-gray-100 dark:border-gray-700 bg-gray-50 dark:bg-white/5">
            <h3 class="font-semibold font-heading text-gray-900 dark:text-white">Performance Reviews</h3>
        </div>
        <div class="overflow-x-auto">
            <table class="w-full text-sm text-left border-collapse">
                <thead
                    class="bg-gray-50 dark:bg-gray-800 border-b border-gray-100 dark:border-gray-700 text-xs uppercase text-gray-500 dark:text-gray-400 font-semibold tracking-wider">
                    <tr>
                        <th class="p-4">Employee</th>
                        <th class="p-4">Cycle</th>
                        <th class="p-4">Review Period</th>
                        <th class="p-4">Status</th>
                        <th class="p-4 text-right">Actions</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-100 dark:divide-gray-800">
                    <tr class="hover:bg-gray-50 dark:hover:bg-white/5 transition-colors">
                        <td class="p-4">
                            <div class="font-medium text-gray-900 dark:text-white">Jane Smith</div>
                            <div class="text-xs text-gray-400">Senior Developer</div>
                        </td>
                        <td class="p-4 text-gray-600 dark:text-gray-300">Q4 2024</td>
                        <td class="p-4 text-gray-600 dark:text-gray-300">Oct - Dec 2024</td>
                        <td class="p-4">
                            <span
                                class="px-2 py-1 text-xs font-medium rounded-full border bg-yellow-50 text-yellow-700 border-yellow-200 dark:bg-yellow-900/20 dark:text-yellow-400">
                                Pending
                            </span>
                        </td>
                        <td class="p-4 text-right">
                            <button class="text-primary-600 hover:text-primary-700 font-medium text-xs cursor-pointer">
                                Start Review <i class="fas fa-arrow-right ml-1"></i>
                            </button>
                        </td>
                    </tr>
                    <tr>
                        <td colspan="5" class="p-8 text-center text-gray-500 dark:text-gray-400">
                            <i class="fas fa-clipboard-list text-4xl text-gray-300 dark:text-gray-600 mb-3 block"></i>
                            No pending reviews. Check back later for new assignments.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
