<div class="max-w-4xl mx-auto space-y-6 animate-fade-in p-2">
    <!-- Header -->
    <div class="flex items-center justify-between">
        <h1 class="text-2xl font-bold font-heading text-gray-800 dark:text-white">Notifications</h1>
        <button (click)="markAllRead()"
            class="text-sm font-medium text-primary-600 hover:text-primary-700 dark:text-primary-400 transition-colors">
            <i class="fas fa-check-double mr-1"></i> Mark all as read
        </button>
    </div>

    <!-- Notifications List -->
    <div class="space-y-4">
        <ng-container *ngFor="let notif of notifications()">
            <div [ngClass]="{'bg-blue-50 dark:bg-blue-900/20': !notif.is_read}"
                class="card flex gap-4 transition-all hover:shadow-md cursor-pointer">

                <div class="flex-shrink-0 mt-1">
                    <span class="inline-flex items-center justify-center h-8 w-8 rounded-full" [ngClass]="{
                            'bg-blue-100 text-blue-600 dark:bg-blue-900/20 dark:text-blue-400': notif.notification_type === 'INFO',
                            'bg-green-100 text-green-600 dark:bg-green-900/20 dark:text-green-400': notif.notification_type === 'SUCCESS',
                            'bg-yellow-100 text-yellow-600 dark:bg-yellow-900/20 dark:text-yellow-400': notif.notification_type === 'WARNING',
                            'bg-red-100 text-red-600 dark:bg-red-900/20 dark:text-red-400': notif.notification_type === 'ERROR'
                        }">
                        <i class="fas" [ngClass]="{
                            'fa-info-circle': notif.notification_type === 'INFO',
                            'fa-check-circle': notif.notification_type === 'SUCCESS',
                            'fa-exclamation-triangle': notif.notification_type === 'WARNING',
                            'fa-times-circle': notif.notification_type === 'ERROR'
                        }"></i>
                    </span>
                </div>

                <div class="flex-1">
                    <div class="flex justify-between items-start">
                        <h3 class="text-sm font-medium text-gray-900 dark:text-white"
                            [class.font-bold]="!notif.is_read">
                            {{ notif.title }}
                        </h3>
                        <span class="text-xs text-gray-500 dark:text-gray-400 whitespace-nowrap ml-2">{{
                            notif.created_at | date:'short' }}</span>
                    </div>
                    <p class="text-sm text-gray-600 dark:text-gray-300 mt-1">{{ notif.message }}</p>
                    <div *ngIf="notif.link" class="mt-2">
                        <a [routerLink]="notif.link"
                            class="text-sm text-primary-600 hover:text-primary-700 dark:text-primary-400 font-medium">
                            View Details <i class="fas fa-arrow-right ml-1"></i>
                        </a>
                    </div>
                </div>

                <div *ngIf="!notif.is_read" class="flex-shrink-0 self-center">
                    <button (click)="markAsRead(notif.id)"
                        class="text-xs text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 transition-colors"
                        title="Mark as read">
                        <div class="w-3 h-3 bg-primary-600 rounded-full"></div>
                    </button>
                </div>
            </div>
        </ng-container>

        <div *ngIf="notifications()?.length === 0"
            class="card text-center py-12 bg-gray-50 dark:bg-gray-800/50 border-dashed">
            <i class="fas fa-bell-slash text-4xl text-gray-300 dark:text-gray-600 mb-3 block"></i>
            <p class="text-gray-500 dark:text-gray-400">No notifications yet.</p>
        </div>
    </div>
</div>
