<div class="space-y-6 animate-fade-in relative z-10">
    <!-- Header -->
    <div *ngIf="job() as j" class="card p-6 rounded-2xl">
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
                <a routerLink="/dashboard/recruitment/jobs"
                    class="text-sm text-gray-500 hover:text-primary-600 mb-2 inline-block">
                    <i class="fas fa-arrow-left mr-1"></i> Back to Jobs
                </a>
                <h1 class="text-2xl font-bold font-heading text-gray-900 dark:text-white">{{ j.title }}</h1>
                <div class="flex items-center gap-4 mt-2 text-sm text-gray-500">
                    <span><i class="fas fa-building mr-1"></i> {{ j.department_name }}</span>
                    <span><i class="fas fa-map-marker-alt mr-1"></i> {{ j.location_name }}</span>
                    <span class="px-2 py-0.5 rounded-full text-xs font-medium bg-blue-100 text-blue-700">{{ j.type
                        }}</span>
                </div>
            </div>

            <div class="flex items-center gap-3">
                <button class="btn btn-secondary">
                    <i class="fas fa-edit mr-2"></i> Edit Job
                </button>
            </div>
        </div>
    </div>

    <!-- Stats or Description? -->

    <!-- Applications Section -->
    <div class="card p-6 rounded-2xl">
        <div class="flex items-center justify-between mb-6">
            <h2 class="text-lg font-bold font-heading text-gray-900 dark:text-white">
                Applications
                <span class="ml-2 px-2 py-0.5 rounded-full bg-primary-100 text-primary-700 text-xs"
                    *ngIf="applications().length">
                    {{ applications().length }}
                </span>
            </h2>
        </div>

        <app-data-table [data]="applications()" [columns]="appColumns" [actions]="appActions" [loading]="isLoading()"
            [showRefresh]="true" (refresh)="refresh()" (actionClick)="handleAction($event)">
        </app-data-table>
    </div>
</div>
