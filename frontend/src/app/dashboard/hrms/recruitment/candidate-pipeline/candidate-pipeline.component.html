<div class="space-y-6 animate-fade-in p-2">
    <!-- Header -->
    <div class="flex items-center justify-between">
        <div>
            <h1 class="text-2xl font-bold font-heading text-gray-800 dark:text-white">Candidate Pipeline</h1>
            <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">Track candidates across recruitment stages.</p>
        </div>
        <button class="btn-primary inline-flex items-center gap-2">
            <i class="fas fa-user-plus w-5 h-5" aria-hidden="true"></i>
            <span>Add Candidate</span>
        </button>
    </div>

    <!-- Kanban Board -->
    <div class="flex gap-6 overflow-x-auto pb-6">
        <div *ngFor="let stage of stages" class="min-w-[300px] flex-shrink-0">
            <!-- Stage Header -->
            <div
                class="flex items-center justify-between mb-4 p-3 rounded-xl bg-gray-100 dark:bg-gray-800 border border-gray-200 dark:border-gray-700">
                <h3
                    class="font-bold text-gray-700 dark:text-gray-200 text-sm uppercase tracking-wide flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full" [ngClass]="{
                        'bg-blue-500': stage === 'APPLIED',
                        'bg-yellow-500': stage === 'SCREENING',
                        'bg-purple-500': stage === 'INTERVIEW',
                        'bg-green-500': stage === 'OFFER',
                        'bg-indigo-500': stage === 'HIRED'
                    }"></span>
                    {{ stage }}
                </h3>
                <span
                    class="bg-white dark:bg-gray-700 text-gray-600 dark:text-gray-300 px-2.5 py-0.5 rounded-lg text-xs font-bold border border-gray-200 dark:border-gray-600">
                    {{ kanbanData()[stage].length || 0 }}
                </span>
            </div>

            <!-- Cards Container -->
            <div class="space-y-3">
                <div *ngFor="let app of kanbanData()[stage]"
                    class="card p-4 hover:shadow-xl hover:-translate-y-1 transition-all cursor-pointer group">
                    <div class="flex justify-between items-start mb-2">
                        <h4 class="font-bold text-gray-900 dark:text-white">
                            {{ app.candidate_details.first_name }} {{ app.candidate_details.last_name }}
                        </h4>
                        <div class="relative">
                            <button
                                class="text-gray-400 hover:text-primary-500 dark:hover:text-primary-400 p-1 transition-colors opacity-0 group-hover:opacity-100"
                                aria-label="More actions">
                                <i class="fas fa-ellipsis-v w-4 h-4" aria-hidden="true"></i>
                            </button>
                            <!-- Dropdown would go here, simplified for specific interaction -->
                        </div>
                    </div>
                    <p
                        class="text-xs text-primary-600 dark:text-primary-400 mb-2 font-medium bg-primary-50/50 dark:bg-primary-900/20 px-2 py-1 rounded inline-block border border-primary-100/50 dark:border-primary-800/30">
                        {{ app.job_title }}</p>
                    <div class="flex items-center gap-2 text-xs text-gray-500 dark:text-gray-400 mt-2">
                        <i class="fas fa-clock w-3.5 h-3.5" aria-hidden="true"></i>
                        <span>{{ app.applied_at | date:'MMM d' }}</span>
                    </div>
                    <div *ngIf="app.rating > 0" class="mt-2 flex text-orange-400 gap-0.5">
                        <i *ngFor="let star of [1,2,3,4,5]" [class.fas]="star <= app.rating"
                            [class.far]="star > app.rating" class="fa-star text-xs w-3 h-3" aria-hidden="true"></i>
                    </div>
                </div>

                <div *ngIf="!kanbanData()[stage]?.length"
                    class="text-center py-8 border-2 border-dashed border-gray-200 dark:border-gray-700 rounded-xl bg-gray-50 dark:bg-gray-800/50">
                    <i class="fas fa-user-slash text-2xl text-gray-300 dark:text-gray-600 mb-2 block"
                        aria-hidden="true"></i>
                    <p class="text-xs text-gray-400 font-medium">Empty</p>
                </div>
            </div>
        </div>
    </div>
</div>
