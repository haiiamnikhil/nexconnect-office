<div class="p-6">
    <div class="flex justify-between items-center mb-6">
        <div>
            <h1 class="text-2xl font-bold text-gray-900">Job Applications</h1>
            <p class="text-sm text-gray-500 mt-1">Manage candidates and hiring workflow</p>
        </div>
    </div>

    <div class="bg-white rounded-lg shadow">
        <app-data-table [data]="applications" [columns]="columns" [actions]="actions" [showRefresh]="true"
            (refresh)="loadApplications()" (actionClicked)="handleAction($event)">
        </app-data-table>
    </div>
</div>
