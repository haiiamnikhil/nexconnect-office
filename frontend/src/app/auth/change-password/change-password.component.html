<div
    class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-50 to-indigo-50 dark:from-gray-900 dark:to-gray-800 p-4">
    <div class="max-w-md w-full">
        <!-- Card -->
        <div class="bg-white dark:bg-dark-card rounded-2xl shadow-2xl p-8 border border-gray-100 dark:border-gray-800">
            <!-- Header -->
            <div class="text-center mb-8">
                <div
                    class="w-16 h-16 bg-primary-100 dark:bg-primary-900/30 rounded-full flex items-center justify-center mx-auto mb-4">
                    <i class="fas fa-lock text-2xl text-primary-600 dark:text-primary-400"></i>
                </div>
                <h1 class="text-2xl font-bold text-gray-800 dark:text-white mb-2">Change Password</h1>
                <p class="text-sm text-gray-500 dark:text-gray-400">{{isFirstTime ? 'You must change your password
                    before continuing' : 'Update your account password'}}</p>
            </div>

            <!-- Form -->
            <form (ngSubmit)="changePassword()" class="space-y-4">
                <!-- Current Password -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                        Current Password
                    </label>
                    <div class="relative">
                        <input [type]="showCurrentPassword() ? 'text' : 'password'" [(ngModel)]="form.oldPassword"
                            name="oldPassword" required
                            class="w-full px-4 py-3 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-gray-800 dark:text-white focus:ring-2 focus:ring-primary-500 focus:border-transparent"
                            placeholder="Enter current password" />
                        <button type="button" (click)="showCurrentPassword.set(!showCurrentPassword())"
                            class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
                            <i [class]="showCurrentPassword() ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
                        </button>
                    </div>
                </div>

                <!-- New Password -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                        New Password
                    </label>
                    <div class="relative">
                        <input [type]="showNewPassword() ? 'text' : 'password'" [(ngModel)]="form.newPassword"
                            name="newPassword" required minlength="8"
                            class="w-full px-4 py-3 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-gray-800 dark:text-white focus:ring-2 focus:ring-primary-500 focus:border-transparent"
                            placeholder="Enter new password (min 8 characters)" />
                        <button type="button" (click)="showNewPassword.set(!showNewPassword())"
                            class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
                            <i [class]="showNewPassword() ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
                        </button>
                    </div>
                </div>

                <!-- Confirm Password -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                        Confirm New Password
                    </label>
                    <div class="relative">
                        <input [type]="showConfirmPassword() ? 'text' : 'password'" [(ngModel)]="form.confirmPassword"
                            name="confirmPassword" required
                            class="w-full px-4 py-3 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-gray-800 dark:text-white focus:ring-2 focus:ring-primary-500 focus:border-transparent"
                            placeholder="Confirm new password" />
                        <button type="button" (click)="showConfirmPassword.set(!showConfirmPassword())"
                            class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
                            <i [class]="showConfirmPassword() ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
                        </button>
                    </div>
                </div>

                <!-- Error Message -->
                <div *ngIf="errorMessage()"
                    class="p-3 bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 rounded-lg">
                    <p class="text-sm text-red-600 dark:text-red-400">{{ errorMessage() }}</p>
                </div>

                <!-- Submit Button -->
                <button type="submit" [disabled]="isLoading()"
                    class="w-full py-3 px-4 bg-gradient-to-r from-primary-600 to-primary-700 hover:from-primary-700 hover:to-primary-800 text-white font-semibold rounded-lg shadow-lg hover:shadow-xl transition-all duration-200 disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2">
                    <i *ngIf="!isLoading()" class="fas fa-check"></i>
                    <i *ngIf="isLoading()" class="fas fa-circle-notch fa-spin"></i>
                    <span>{{ isLoading() ? 'Changing Password...' : 'Change Password' }}</span>
                </button>

                <!-- Cancel Button (only if not first time) -->
                <button *ngIf="!isFirstTime" type="button" (click)="cancel()"
                    class="w-full py-3 px-4 bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-300 font-semibold rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700 transition-all duration-200">
                    Cancel
                </button>
            </form>
        </div>
    </div>
</div>
