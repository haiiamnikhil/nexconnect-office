<div class="min-h-screen bg-gray-50 font-sans text-text">
    <app-navbar></app-navbar>

    <main class="pt-24 pb-20">
        <div class="container mx-auto px-4 md:px-6">

            <!-- Page Header -->
            <div class="text-center max-w-3xl mx-auto mb-16" appScrollAnimation>
                <h1 class="text-4xl md:text-5xl font-bold text-gray-900 mb-6 font-heading">Get in Touch</h1>
                <p class="text-xl text-gray-600">Have questions about Sentura? We're here to help. Reach out to our
                    team.
                </p>
            </div>

            <div class="max-w-4xl mx-auto">

                <!-- Simplified Contact Options -->
                <div class="flex flex-col md:flex-row justify-center gap-6 mb-12">
                    <div
                        class="bg-white px-8 py-6 rounded-2xl shadow-sm border border-gray-100 flex items-center gap-4 hover:shadow-md transition-all">
                        <div
                            class="w-12 h-12 bg-primary-50 rounded-full flex items-center justify-center text-primary-600">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                                stroke="currentColor" class="w-6 h-6">
                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75" />
                            </svg>
                        </div>
                        <div>
                            <h3 class="font-bold text-gray-900">General Inquiries</h3>
                            <a href="mailto:hello&#64;nexconnect.com"
                                class="text-primary-600 font-medium hover:underline">hello&#64;nexconnect.com</a>
                        </div>
                    </div>

                    <div
                        class="bg-white px-8 py-6 rounded-2xl shadow-sm border border-gray-100 flex items-center gap-4 hover:shadow-md transition-all">
                        <div class="w-12 h-12 bg-blue-50 rounded-full flex items-center justify-center text-blue-600">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                                stroke="currentColor" class="w-6 h-6">
                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09zM18.259 8.715L18 9.75l-.259-1.035a3.375 3.375 0 00-2.455-2.456L14.25 6l1.036-.259a3.375 3.375 0 002.455-2.456L18 2.25l.259 1.035a3.375 3.375 0 002.456 2.456L21.75 6l-1.035.259a3.375 3.375 0 00-2.456 2.456zM16.894 20.567L16.5 21.75l-.394-1.183a2.25 2.25 0 00-1.423-1.423L13.5 18.75l1.183-.394a2.25 2.25 0 001.423-1.423l.394-1.183.394 1.183a2.25 2.25 0 001.423 1.423l1.183.394-1.183.394a2.25 2.25 0 00-1.423 1.423z" />
                            </svg>
                        </div>
                        <div>
                            <h3 class="font-bold text-gray-900">Technical Support</h3>
                            <a href="mailto:support&#64;nexconnect.com"
                                class="text-blue-600 font-medium hover:underline">support&#64;nexconnect.com</a>
                        </div>
                    </div>
                </div>

                <!-- Contact Form -->
                <div class="bg-white p-8 md:p-12 rounded-3xl shadow-xl border border-gray-100 relative overflow-hidden"
                    appScrollAnimation animationClass="animate-fade-in-up">
                    <!-- Decor -->
                    <div class="absolute top-0 right-0 w-32 h-32 bg-primary-50 rounded-bl-[100px] -mr-8 -mt-8 z-0">
                    </div>

                    <div class="relative z-10">
                        <h2 class="text-2xl font-bold text-gray-900 mb-8 text-center">Send us a message</h2>

                        <form (ngSubmit)="onSubmit()" #contactForm="ngForm" class="space-y-6">
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div>
                                    <label for="name" class="block text-sm font-semibold text-gray-700 mb-2">Full
                                        Name</label>
                                    <input type="text" id="name" name="name" [(ngModel)]="formData.name" required
                                        class="w-full px-4 py-3 rounded-xl bg-gray-50 border border-gray-200 focus:border-primary-500 focus:bg-white focus:ring-4 focus:ring-primary-100 transition-all outline-none"
                                        placeholder="John Doe">
                                </div>
                                <div>
                                    <label for="email" class="block text-sm font-semibold text-gray-700 mb-2">Email
                                        Address</label>
                                    <input type="email" id="email" name="email" [(ngModel)]="formData.email" required
                                        class="w-full px-4 py-3 rounded-xl bg-gray-50 border border-gray-200 focus:border-primary-500 focus:bg-white focus:ring-4 focus:ring-primary-100 transition-all outline-none"
                                        placeholder="john@company.com">
                                </div>
                            </div>

                            <div>
                                <label for="subject"
                                    class="block text-sm font-semibold text-gray-700 mb-2">Subject</label>
                                <select id="subject" name="subject" [(ngModel)]="formData.subject"
                                    class="w-full px-4 py-3 rounded-xl bg-gray-50 border border-gray-200 focus:border-primary-500 focus:bg-white focus:ring-4 focus:ring-primary-100 transition-all outline-none">
                                    <option value="" disabled selected>Select a topic</option>
                                    <option value="sales">Sales Inquiry</option>
                                    <option value="support">Technical Support</option>
                                    <option value="billing">Billing Question</option>
                                    <option value="other">Other</option>
                                </select>
                            </div>

                            <div>
                                <label for="message"
                                    class="block text-sm font-semibold text-gray-700 mb-2">Message</label>
                                <textarea id="message" name="message" [(ngModel)]="formData.message" required rows="6"
                                    class="w-full px-4 py-3 rounded-xl bg-gray-50 border border-gray-200 focus:border-primary-500 focus:bg-white focus:ring-4 focus:ring-primary-100 transition-all outline-none resize-none"
                                    placeholder="How can we help you today?"></textarea>
                            </div>

                            <button type="submit" [disabled]="!contactForm.form.valid"
                                class="w-full py-4 px-6 bg-primary-600 hover:bg-primary-700 text-white font-bold rounded-xl shadow-lg shadow-primary-500/30 transition-all transform hover:-translate-y-1 disabled:opacity-50 disabled:cursor-not-allowed">
                                Send Message
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <app-footer></app-footer>
</div>
