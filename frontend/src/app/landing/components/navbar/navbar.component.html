<header
    class="fixed w-full top-0 z-50 bg-white/90 backdrop-blur-md border-b border-gray-100 transition-all duration-300">
    <div class="container mx-auto px-4 md:px-6 h-16 flex items-center justify-between">
        <!-- Logo -->
        <a routerLink="/" class="flex items-center gap-2 group">
            <img src="assets/nexconnect-logo.png" alt="NexConnect Logo"
                class="w-10 h-10 rounded-lg shadow-lg shadow-primary-500/30 group-hover:scale-110 transition-transform duration-300">
        </a>

        <!-- Desktop Navigation -->
        <nav class="hidden md:flex items-center gap-8">

            <a routerLink="/products"
                class="text-sm font-medium text-gray-600 hover:text-primary-600 transition-colors relative group"
                routerLinkActive="!text-primary-600 !font-semibold">
                Products
                <span class="absolute -bottom-1 left-0 w-0 h-0.5 bg-primary-600 transition-all group-hover:w-full"
                    routerLinkActive="w-full"></span>
            </a>
            <a routerLink="/about"
                class="text-sm font-medium text-gray-600 hover:text-primary-600 transition-colors relative group"
                routerLinkActive="!text-primary-600 !font-semibold">
                About
                <span class="absolute -bottom-1 left-0 w-0 h-0.5 bg-primary-600 transition-all group-hover:w-full"
                    routerLinkActive="w-full"></span>
            </a>
            <a routerLink="/contact"
                class="text-sm font-medium text-gray-600 hover:text-primary-600 transition-colors relative group"
                routerLinkActive="!text-primary-600 !font-semibold">
                Contact
                <span class="absolute -bottom-1 left-0 w-0 h-0.5 bg-primary-600 transition-all group-hover:w-full"
                    routerLinkActive="w-full"></span>
            </a>
        </nav>

        <!-- CTA Buttons -->
        <div class="hidden md:flex items-center gap-4">
            <a routerLink="/login"
                class="text-sm font-medium text-gray-600 hover:text-primary-600 transition-colors px-3 py-2 rounded-md hover:bg-gray-50">Login</a>
            <a routerLink="/register"
                class="bg-primary-600 hover:bg-primary-700 text-white px-5 py-2.5 rounded-xl text-sm font-semibold transition-all shadow-lg shadow-primary-500/25 hover:shadow-primary-500/40 hover:-translate-y-0.5">Get
                Started</a>
        </div>

        <!-- Mobile Menu Button -->
        <button (click)="toggleMenu()" class="md:hidden p-2 text-gray-600 hover:text-primary-600 focus:outline-none">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                stroke="currentColor" class="w-6 h-6">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"
                    *ngIf="!isMenuOpen" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" *ngIf="isMenuOpen" />
            </svg>
        </button>
    </div>

    <!-- Mobile Menu -->
    <div *ngIf="isMenuOpen"
        class="md:hidden absolute top-16 left-0 w-full bg-white border-b border-gray-100 shadow-xl animate-fade-in z-40">
        <div class="flex flex-col p-4 space-y-4">
            <a routerLink="/products" (click)="toggleMenu()" routerLinkActive="bg-primary-50 text-primary-600"
                class="text-base font-medium text-gray-600 hover:text-primary-600 px-4 py-2 hover:bg-gray-50 rounded-lg transition-colors">Products</a>
            <a routerLink="/about" (click)="toggleMenu()" routerLinkActive="bg-primary-50 text-primary-600"
                class="text-base font-medium text-gray-600 hover:text-primary-600 px-4 py-2 hover:bg-gray-50 rounded-lg transition-colors">About</a>
            <a routerLink="/contact" (click)="toggleMenu()" routerLinkActive="bg-primary-50 text-primary-600"
                class="text-base font-medium text-gray-600 hover:text-primary-600 px-4 py-2 hover:bg-gray-50 rounded-lg transition-colors">Contact</a>

            <div class="border-t border-gray-100 pt-4 flex flex-col gap-3">
                <a routerLink="/login" (click)="toggleMenu()"
                    class="w-full text-center py-2.5 text-gray-600 font-medium hover:text-primary-600 hover:bg-gray-50 rounded-lg border border-gray-200">Login</a>
                <a routerLink="/register" (click)="toggleMenu()"
                    class="w-full text-center py-2.5 bg-primary-600 text-white font-semibold rounded-lg shadow-lg shadow-primary-500/25 hover:bg-primary-700">Get
                    Started Free</a>
            </div>
        </div>
    </div>
</header>
