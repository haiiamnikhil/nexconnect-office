<div class="fixed top-4 right-4 z-[100] flex flex-col gap-2 pointer-events-none">
    <div *ngFor="let toast of toastService.toasts()" @toastAnimation
        class="pointer-events-auto min-w-[300px] max-w-md p-4 rounded-lg shadow-lg border-l-4 flex items-start gap-3 bg-white dark:bg-gray-800"
        [ngClass]="{
         'border-green-500': toast.type === 'success',
         'border-red-500': toast.type === 'error',
         'border-blue-500': toast.type === 'info',
         'border-yellow-500': toast.type === 'warning'
       }">

        <!-- Icon -->
        <div class="flex-shrink-0 mt-0.5">
            <i class="fas" [ngClass]="{
        'fa-check-circle text-green-500': toast.type === 'success',
        'fa-exclamation-circle text-red-500': toast.type === 'error',
        'fa-info-circle text-blue-500': toast.type === 'info',
        'fa-exclamation-triangle text-yellow-500': toast.type === 'warning'
      }"></i>
        </div>

        <!-- Message -->
        <div class="flex-1">
            <p class="text-sm font-medium text-gray-900 dark:text-gray-100">
                {{ toast.type | titlecase }}
            </p>
            <p class="text-sm text-gray-500 dark:text-gray-400 mt-0.5">
                {{ toast.message }}
            </p>
        </div>

        <!-- Close Button -->
        <button (click)="toastService.remove(toast.id)"
            class="flex-shrink-0 text-gray-400 hover:text-gray-500 dark:hover:text-gray-300 transition-colors">
            <i class="fas fa-times"></i>
        </button>
    </div>
</div>
