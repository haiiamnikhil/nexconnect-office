<div class="min-h-screen bg-gray-50 dark:bg-dark-bg font-sans text-text dark:text-dark-text">
    <!-- Navbar -->
    <nav class="bg-white dark:bg-dark-card border-b border-gray-100 dark:border-white/5 sticky top-0 z-10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a routerLink="/careers"
                        class="text-xl font-heading font-bold bg-gradient-to-r from-primary-600 to-primary-400 bg-clip-text text-transparent">
                        <i class="fas fa-rocket mr-2"></i> Careers
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="max-w-4xl mx-auto px-4 py-8 sm:px-6 lg:px-8">
        <!-- Loading -->
        <div *ngIf="isLoading()" class="flex justify-center p-12">
            <i class="fas fa-spinner fa-spin text-3xl text-primary-500"></i>
        </div>

        <!-- Error -->
        <div *ngIf="error()" class="p-4 bg-red-50 text-red-700 rounded-xl text-center">
            {{ error() }}
        </div>

        <!-- Job Detail -->
        <div *ngIf="job() && !isLoading()"
            class="bg-white dark:bg-dark-card rounded-2xl shadow-sm border border-gray-100 dark:border-gray-800 overflow-hidden">
            <!-- Header -->
            <div class="p-8 border-b border-gray-100 dark:border-gray-800 bg-gray-50/50 dark:bg-white/5">
                <div class="flex justify-between items-start flex-wrap gap-4">
                    <div>
                        <h1 class="text-3xl font-bold text-gray-900 dark:text-white mb-2 font-heading">{{ job()?.title
                            }}</h1>
                        <div class="flex gap-4 text-sm text-gray-500 dark:text-gray-400">
                            <span class="flex items-center gap-1"><i class="fas fa-building"></i> {{
                                job()?.department_name }}</span>
                            <span class="flex items-center gap-1"><i class="fas fa-map-marker-alt"></i> {{
                                job()?.location_name }}</span>
                            <span class="flex items-center gap-1"><i class="fas fa-briefcase"></i> {{ job()?.type
                                }}</span>
                        </div>
                    </div>
                    <button (click)="openApplyModal()"
                        class="px-6 py-3 bg-primary-600 hover:bg-primary-700 text-white font-medium rounded-xl shadow-lg shadow-primary-500/30 transition-all hover:-translate-y-0.5">
                        Apply Now
                    </button>
                </div>
            </div>

            <!-- Description (Placeholder text for now as generic, assuming description field exists essentially) -->
            <div class="p-8 space-y-6">
                <section>
                    <h3 class="text-lg font-bold text-gray-900 dark:text-white mb-3">About the Role</h3>
                    <p class="text-gray-600 dark:text-gray-300 leading-relaxed">
                        Join our team as a {{ job()?.title }}. We are looking for passionate individuals to help us
                        build the future of SaaS.
                    </p>
                </section>

                <!-- If backend has description field, use it here -->
            </div>
        </div>
    </div>

    <!-- Application Modal -->
    <div *ngIf="showApplyModal"
        class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm animate-fade-in">
        <div
            class="bg-white dark:bg-dark-card rounded-2xl w-full max-w-lg shadow-2xl border border-gray-100 dark:border-gray-800">
            <div class="p-6 border-b border-gray-100 dark:border-gray-800 flex justify-between items-center">
                <h3 class="text-xl font-bold text-gray-900 dark:text-white">Apply for {{ job()?.title }}</h3>
                <button (click)="showApplyModal = false"
                    class="text-gray-400 hover:text-gray-500 dark:hover:text-gray-300">
                    <i class="fas fa-times text-lg"></i>
                </button>
            </div>

            <div class="p-6 space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">First
                            Name</label>
                        <input [(ngModel)]="applicant.first_name" type="text"
                            class="w-full px-4 py-2 rounded-lg border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-dark-bg focus:ring-2 focus:ring-primary-500 outline-none transition-all">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Last Name</label>
                        <input [(ngModel)]="applicant.last_name" type="text"
                            class="w-full px-4 py-2 rounded-lg border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-dark-bg focus:ring-2 focus:ring-primary-500 outline-none transition-all">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Email</label>
                    <input [(ngModel)]="applicant.email" type="email"
                        class="w-full px-4 py-2 rounded-lg border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-dark-bg focus:ring-2 focus:ring-primary-500 outline-none transition-all">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Phone</label>
                    <input [(ngModel)]="applicant.phone" type="tel"
                        class="w-full px-4 py-2 rounded-lg border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-dark-bg focus:ring-2 focus:ring-primary-500 outline-none transition-all">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Resume
                        (PDF/DOC)</label>
                    <input (change)="onFileSelected($event)" type="file" accept=".pdf,.doc,.docx"
                        class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-primary-50 file:text-primary-700 hover:file:bg-primary-100">
                </div>
            </div>

            <div class="p-6 border-t border-gray-100 dark:border-gray-800 flex justify-end gap-3">
                <button (click)="showApplyModal = false"
                    class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg transition-colors">Cancel</button>
                <button (click)="submitApplication()" [disabled]="isSubmitting"
                    class="px-6 py-2 bg-primary-600 hover:bg-primary-700 text-white font-medium rounded-lg shadow-lg shadow-primary-500/30 transition-all disabled:opacity-50">
                    <span *ngIf="isSubmitting"><i class="fas fa-spinner fa-spin mr-2"></i> Sending...</span>
                    <span *ngIf="!isSubmitting">Submit Application</span>
                </button>
            </div>
        </div>
    </div>
</div>
